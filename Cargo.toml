[package]
name = "vaire"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Derived reference-graph index over a Markdown knowledge corpus, with a CLI and an MCP server"
authors = ["Maarten van Ittersum"]
license = "MIT"
readme = "README.md"
keywords = ["knowledge", "markdown", "graph", "index", "mcp"]
categories = ["command-line-utilities", "text-processing"]
repository = "https://github.com/dezemand/vaire"

[[bin]]
name = "vaire"
path = "src/main.rs"

[lib]
name = "vaire"
path = "src/lib.rs"

[dependencies]
# CLI surface (cli.md §2)
clap = { version = "4", features = ["derive", "env"] }

# Output shapes — JSON is the canonical machine shape, mirrored by MCP (cli.md §2.3)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Frontmatter is YAML
serde_yaml = "0.9"

# Authored config (cli.md §6)
toml = "0.8"
# Format- and comment-preserving edits to the user-authored knowledge.toml (`vaire add`);
# already in the build graph as a transitive dep of `toml`.
toml_edit = "0.22"

# Derived index: Turso Database — the Rust rewrite of SQLite — as a local embedded file
# engine, for its native full-text search and native vectors (design.md §9, issue #2 M3).
# `fts` gates the experimental FTS index method (also enabled per-connection at runtime).
turso = { version = "0.7", features = ["fts"] }
# Turso's embedded API is async (io_uring); we own one current-thread runtime inside the
# `Index` and `block_on` at that boundary, keeping the rest of the CLI synchronous.
tokio = { version = "1", features = ["rt"] }

# Corpus discovery: include/exclude globs over the working tree (cli.md §6)
globset = "0.4"
walkdir = "2"

# Errors → typed exit codes (cli.md §7)
thiserror = "2"

# Blocking HTTP for the OpenAI embedding provider (rustls TLS, no async runtime)
ureq = "2"
url = "2"
directories = "6.0.0"

# SHA-256 for verifying release downloads against the published SHA256SUMS
# (`vaire upgrade`, mirroring install.sh/install.ps1) and for artifact digests
# (`vaire pack`). Note `embed::cache::hash_text` is NOT usable here — it is a
# DefaultHasher stub for cache keys, not a cryptographic digest.
sha2 = "0.10"

# Artifact writing (`vaire pack`): a deterministic tar stream, gzip-compressed. Written
# in-process (never the system `tar`) so entry order, timestamps, and ownership are
# pinned — same commit, same flags, same bytes (registry.md §5). The compression backend
# is pinned explicitly (default features off): letting feature unification swap in zlib
# or zlib-ng would silently change the artifact bytes.
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Interactive prompts for `vaire configure` (guided TUI-style wizard)
inquire = "0.9"

[dev-dependencies]
# Throwaway git-repo corpora for integration tests
tempfile = "3"
# Compute expected digests when asserting on release-download verification
sha2 = "0.10"
# Read `vaire pack` artifacts back in tests (integration tests cannot see the lib's own
# dependency graph, so the archive crates are declared here too)
tar = "0.4"
flate2 = "1"
