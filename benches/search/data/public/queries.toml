# Search-relevance benchmark queries for the public corpus (issue #52).
#
# Grading: 2 = the primary answer a user wants; 1 = also relevant/useful (a closely
# related concept, the command that implements it, or a long spec/skill that covers the
# topic in depth). Judgments were made by reading the corpus, not by tuning against the
# current (flawed) ranking.

